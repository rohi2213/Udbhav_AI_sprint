<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roommates — NEXT MOVE</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav" data-std></header>
<main class="sec"><div class="wrap"><h1>Roommates</h1><p class="mut"><b>Stay safe:</b> posts use a display name only. Contact details are shared only with the post owner. Meet in public first, verify in person, and never pay money before seeing a place or agreement.</p>
<div class="filters"><label>Locality<input id="fl" list="locs"></label><label>Looking for<select id="ft"><option value="">All</option><option value="have-room">Has a room, needs roommate</option><option value="need-room">Needs a room</option></select></label><label>Max budget (₹)<input id="fb" type="number" min="0"></label><button id="fc" class="btn ghost" type="button">Clear</button></div>
<div id="list" class="grid3" aria-live="polite"></div>
<h2>Post yourself</h2><form id="pf" class="card formgrid" novalidate><label>Display name<input name="name" maxlength="40" required></label><label>I am<select name="type"><option value="need-room">Looking for a room</option><option value="have-room">Have a room, need a roommate</option></select></label><label>Locality<input name="locality" list="locs" maxlength="60" required></label><label>Monthly budget (₹)<input name="budget" type="number" min="500" required></label><label>Roommate preference<select name="gender"><option value="any">Any</option><option value="male">Male</option><option value="female">Female</option></select></label><label class="full">Short bio (no phone numbers)<textarea name="bio" rows="3" maxlength="300" required></textarea></label><div class="full"><button class="btn" type="submit">Post</button> <span id="pm" role="status"></span></div></form>
<h2>Your posts and requests (this browser)</h2><div id="mine"></div></div></main>
<datalist id="locs"></datalist><script src="common.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mineCount=0,keys={};try{const v=JSON.parse(localStorage.getItem('sm_rmkeys'));if(v&&typeof v==='object')keys=v}catch{}const sk=()=>{try{localStorage.setItem('sm_rmkeys',JSON.stringify(keys))}catch{}};
const T={'have-room':'Has a room, needs roommate','need-room':'Needs a room'};
const J=async(u,o)=>{const r=await fetch(u,o),j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j};
async function load(){let p=[];try{p=(await J('/api/roommates?'+new URLSearchParams({locality:$('#fl').value.trim(),type:$('#ft').value}))).posts}catch(e){$('#list').innerHTML='<p class="empty">Could not load posts.</p>';return}
 const mb=Number($('#fb').value)||0;const shown=p.filter(x=>!mb||x.budget<=mb);
 $('#list').innerHTML=shown.length?shown.map(x=>`<article class="card"><span class="badge">${T[x.type]}</span><h3>${esc(x.name)}</h3><p class="mut">${esc(x.locality)} · up to ₹${x.budget}/month · prefers: ${esc(x.gender)}</p><p>${esc(x.bio)}</p>
 <details><summary>Request to connect</summary><form data-r="${esc(x.id)}" class="formgrid"><label>Your name<input name="name" maxlength="40" required></label><label>Your contact (shared with this poster only)<input name="contact" maxlength="80" required></label><label>Message<textarea name="message" maxlength="300" rows="2" required></textarea></label><button class="btn" type="submit">Send request</button> <small role="status"></small></form></details></article>`).join(''):'<p class="empty">No posts match. Be the first to post below.</p>';
 const mine=p.filter(x=>keys[x.id]);mineCount=mine.length;$('#mine').innerHTML=mine.length?mine.map(x=>`<div class="card"><b>${esc(x.name)}</b> — ${esc(x.locality)} <button class="btn ghost" data-v="${esc(x.id)}">View requests</button> <button class="btn ghost" data-d="${esc(x.id)}">Delete</button><div id="rq_${esc(x.id)}"></div></div>`).join(''):'<p class="empty">You have no posts yet.</p>'}
['fl','ft','fb'].forEach(i=>$('#'+i).addEventListener('input',load));$('#fc').onclick=()=>{$('#fl').value='';$('#ft').value='';$('#fb').value='';load()};
$('#pf').onsubmit=async e=>{e.preventDefault();const m=$('#pm');m.className='';if(mineCount>=SM.limit('rm')){m.className='err';m.textContent='Your '+SM.tier()+' plan allows '+SM.limit('rm')+' post(s). Delete one or choose a bigger plan.';return}m.textContent='Posting…';try{const j=await J('/api/roommates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});keys[j.post.id]=j.editKey;sk();e.target.reset();m.className='ok';m.textContent='Posted.';load()}catch(x){m.className='err';m.textContent=x.message}};
document.addEventListener('submit',async e=>{const id=e.target.dataset.r;if(!id)return;e.preventDefault();const s=e.target.querySelector('small');try{await J(`/api/roommates/${id}/requests`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();s.className='ok';s.textContent='Request sent.'}catch(x){s.className='err';s.textContent=x.message}});
document.addEventListener('click',async e=>{const v=e.target.dataset.v,d=e.target.dataset.d;
 if(v){try{const r=(await J(`/api/roommates/${v}/requests`,{headers:{'x-edit-key':keys[v]}})).requests;$('#rq_'+v).innerHTML=r.length?r.map(q=>`<p><b>${esc(q.name)}</b> (${esc(q.contact)}): ${esc(q.message)} <span class="mut">${esc(q.createdAt)}</span></p>`).join(''):'<p class="mut">No requests yet.</p>'}catch(x){alert(x.message)}}
 if(d&&confirm('Delete this post?')){try{await J('/api/roommates/'+d,{method:'DELETE',headers:{'x-edit-key':keys[d]}});delete keys[d];sk();load()}catch(x){alert(x.message)}}});
load();
</script></body></html>
